name: ObsCam
options:
  bundleIdPrefix: com.camkey
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ObsCam:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: OBS Cam
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Kết nối máy chủ stream trong mạng LAN.
        NSCameraUsageDescription: Không sử dụng camera.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camkey.obscam
        TARGETED_DEVICE_FAMILY: "1"
